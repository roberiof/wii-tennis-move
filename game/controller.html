<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Wii Tennis Move — Raquete</title>
    <script src="https://www.airconsole.com/api/airconsole-1.11.0.js"></script>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
        -webkit-user-select: none;
      }
      body {
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        background: linear-gradient(145deg, #0288d1, #00b4d8, #48cae4);
        font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
        color: #ffffff;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        align-items: center;
        padding: 24px 20px;
      }
      .header {
        text-align: center;
        margin-top: 10px;
      }
      .brand {
        font-size: 13px;
        letter-spacing: 3px;
        text-transform: uppercase;
        font-weight: 800;
        opacity: 0.85;
        text-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
      }
      .status {
        margin-top: 6px;
        font-size: 14px;
        font-weight: 700;
        background: rgba(255, 255, 255, 0.25);
        backdrop-filter: blur(8px);
        padding: 6px 16px;
        border-radius: 16px;
        display: inline-block;
      }
      .racket-area {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        flex: 1;
        width: 100%;
      }
      .racket-glow {
        width: 200px;
        height: 200px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(255, 255, 255, 0.4) 0%, rgba(255, 255, 255, 0) 70%);
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        transition: transform 0.15s cubic-bezier(0.18, 0.89, 0.32, 1.28);
      }
      .racket-icon {
        font-size: 96px;
        filter: drop-shadow(0 12px 24px rgba(0, 60, 120, 0.3));
        transition: transform 0.2s ease;
      }
      .instruction {
        margin-top: 24px;
        font-size: 19px;
        font-weight: 800;
        text-shadow: 0 2px 10px rgba(0, 0, 0, 0.2);
        text-align: center;
      }
      .last-swing {
        margin-top: 8px;
        font-size: 15px;
        font-weight: 700;
        opacity: 0.9;
        min-height: 22px;
      }
      .power-bar-wrap {
        width: 80%;
        max-width: 260px;
        height: 12px;
        background: rgba(0, 40, 80, 0.25);
        border-radius: 6px;
        margin-top: 14px;
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.4);
      }
      .power-bar-fill {
        height: 100%;
        width: 0%;
        background: #ffffff;
        border-radius: 6px;
        transition: width 0.15s ease-out;
        box-shadow: 0 0 12px #ffffff;
      }
      .footer {
        width: 100%;
        display: flex;
        justify-content: center;
        margin-bottom: 8px;
      }
      .hand-btn {
        background: rgba(255, 255, 255, 0.28);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.6);
        color: #ffffff;
        padding: 12px 28px;
        border-radius: 24px;
        font-size: 14px;
        font-weight: 800;
        box-shadow: 0 8px 20px rgba(0, 60, 120, 0.2);
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <div class="brand">WII TENNIS MOVE</div>
      <div class="status" id="status-label">Conectando ao PC...</div>
    </div>

    <div class="racket-area">
      <div class="racket-glow" id="racket-glow">
        <div class="racket-icon" id="racket-icon">🎾</div>
      </div>
      <div class="instruction">Balançe o celular como raquete</div>
      <div class="last-swing" id="last-swing">Pronto para jogar</div>
      <div class="power-bar-wrap">
        <div class="power-bar-fill" id="power-bar"></div>
      </div>
    </div>

    <div class="footer">
      <button class="hand-btn" id="hand-btn">Modo: Destro</button>
    </div>

    <script type="module" src="/src/controller/main.ts"></script>
  </body>
</html>
